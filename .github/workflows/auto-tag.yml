# Auto-tag on package.json version bump
#
# When a push to main changes package.json["version"] to a value that has no
# matching `vX.Y.Z` tag yet, this workflow creates that tag and then calls
# `publish.yml` (`workflow_call`) to ship the new version to npm.
#
# Net effect: bumping the version in package.json on a PR → merge to main is
# enough to ship to npm. No human needs to remember to tag separately.
#
# Why we CALL publish.yml instead of relying on the tag push:
#   GitHub Actions' GITHUB_TOKEN has anti-loop protection — events generated
#   by GITHUB_TOKEN (like the `git push origin <tag>` below) do NOT trigger
#   downstream workflows that listen on `push: tags`. The previous wiring
#   created the tag but `publish.yml`'s `on: push: tags: ['v*']` trigger
#   stayed dormant, so v0.1.3 had to be re-pushed by hand from a laptop to
#   actually publish. `workflow_call` is GitHub's blessed way to chain
#   workflows without a PAT and keeps the OIDC subject pointing at
#   publish.yml — npm Trusted Publishing keeps working untouched.
#
# Safe by design:
#   - Skips when the tag already exists (idempotent re-runs / manual tagging
#     beforehand work fine).
#   - Skips when the version field didn't actually change.
#   - Uses the workflow's GITHUB_TOKEN (no PAT); branch protection on `main`
#     does NOT apply to tag pushes, so this writes only the tag, never main.

name: Auto-tag on version bump

on:
  push:
    branches: [main]
    paths: ['package.json']

# Permissions are scoped per-job below — the `tag` job needs `contents:write`
# to push the new tag, the `publish` job needs `id-token:write` so the
# reusable `publish.yml` it calls can mint the npm OIDC token. Declaring
# them per-job is the documented way to wire workflow_call: a `permissions`
# block on the calling JOB sets the upper bound for the called workflow. A
# repo-wide block here would either grant id-token to the tag step (we'd
# rather not) or, more commonly, omit it and break the publish job at
# startup — which is exactly what happened on v0.2.0's merge.

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Propagate the "did we just create a tag" decision + the tag name to
      # the publish job below, so it only runs on a real new version.
      tagged: ${{ steps.create.outputs.tagged }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Checkout main (with full history)
        uses: actions/checkout@v6
        with:
          # Need history so we can diff package.json against the previous
          # commit and only tag when the version field actually changed.
          fetch-depth: 0

      - name: Read current version
        id: current
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Current package.json version: $version"

      - name: Skip if previous commit had the same version
        id: changed
        run: |
          # If the file existed in the previous commit, compare. If not (first
          # ever commit / new file), treat as changed.
          if git cat-file -e HEAD~1:package.json 2>/dev/null; then
            prev=$(git show HEAD~1:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{console.log(JSON.parse(s).version)})")
            echo "Previous version: $prev"
            if [ "$prev" = "${{ steps.current.outputs.version }}" ]; then
              echo "Version unchanged → skipping tag"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        if: steps.changed.outputs.changed == 'true'
        id: exists
        run: |
          tag="v${{ steps.current.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists → skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        id: create
        if: steps.changed.outputs.changed == 'true' && steps.exists.outputs.exists == 'false'
        env:
          TAG: v${{ steps.current.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "✓ Pushed $TAG — invoking publish.yml via workflow_call."
          # Surface the tag name to the downstream publish job. We can't rely
          # on the tag push event firing publish.yml on its own (GITHUB_TOKEN
          # anti-loop), so the `publish` job below calls publish.yml directly.
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Chain into publish.yml as a reusable workflow. Runs ONLY when the `tag`
  # job above actually created a new tag (skipped on no-op runs). `secrets:
  # inherit` passes any repo/environment secrets through; the called workflow
  # is what enters the `npm-publish` environment and gets `id-token: write`
  # for OIDC — auto-tag itself stays out of that environment.
  publish:
    needs: tag
    # `needs.tag.result == 'success'` guards against a partially-failed `tag`
    # job that still managed to emit `tagged=true` before crashing — without
    # it, that edge case would trigger publish on a half-done tag run.
    if: needs.tag.result == 'success' && needs.tag.outputs.tagged == 'true'
    # workflow_call ceiling: the CALLED workflow (`publish.yml`) requests
    # `id-token: write` for npm Trusted Publishing OIDC. GitHub's policy says
    # the called workflow can only receive permissions that the CALLER
    # already grants. Without `id-token: write` here, the reusable workflow
    # fails to start with `startup_failure` and v0.X.0 silently never
    # publishes — observed on the v0.2.0 merge. `contents: read` mirrors
    # what publish.yml actually needs to checkout the tagged ref.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

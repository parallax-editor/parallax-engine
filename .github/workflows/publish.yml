# Publishes @parallax-editor/parallax-engine to npm via Trusted Publishing
# (OIDC). No long-lived NPM_TOKEN required — npm mints a short-lived token
# per run, scoped to this workflow + environment + tag.
#
# Setup (one-time, already done):
#   - npm Trusted Publisher configured for the package, with workflow
#     `publish.yml` and environment `npm-publish`.
#   - npm Publishing access set to "require 2FA, disallow tokens".
#   - GitHub environment `npm-publish` created on this repo.
#
# See NPM_PUBLISHING.md for the full step-by-step.

name: Publish to npm

on:
  push:
    tags: ['v*']
  # Reusable: `auto-tag.yml` calls this directly after it pushes a new tag.
  # GitHub Actions' GITHUB_TOKEN does NOT trigger downstream `on: push: tags`
  # workflows (anti-loop protection), so an automated tag never fired this
  # workflow by itself. `workflow_call` sidesteps that — the called job runs
  # under the SAME OIDC subject (job_workflow_ref = .github/workflows/publish.yml)
  # that npm Trusted Publishing expects, so no Trusted Publisher reconfig is
  # needed. The `tag` input is informational (carried in run logs).
  workflow_call:
    inputs:
      tag:
        description: Tag being published (e.g. v0.1.3); informational only — the checkout still uses the calling workflow's ref.
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # When invoked via workflow_call from auto-tag.yml the default checkout
          # ref would be `main` (the calling workflow's ref), NOT the freshly
          # pushed tag. Pin to the tag so we publish the exact commit that was
          # versioned, even if main moves on between the version bump and the
          # publish run. Falls back to `github.ref` for the direct tag-push
          # path so behavior is unchanged there.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
      # npm 11.5.1+ is required for OIDC Trusted Publishing.
      - run: npm install -g npm@latest
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      - run: npm publish --provenance

# Publishes @parallax-editor/parallax-engine to npm.
#
# ── Bootstrap mode (current) ──────────────────────────────────────────────────
# Uses an NPM_TOKEN secret because Trusted Publishing (OIDC) cannot be
# configured on npm until the package exists. After the first successful
# publish:
#   1. Configure Trusted Publishing on the package
#      (https://www.npmjs.com/package/@parallax-editor/parallax-engine/access
#       → Trusted Publishers → Add → GitHub Actions, with workflow `publish.yml`
#       and environment `npm-publish`).
#   2. Delete the NPM_TOKEN secret from this repo.
#   3. Switch this workflow to OIDC-only (remove the NODE_AUTH_TOKEN env block;
#      keep `permissions.id-token: write` and `environment: npm-publish`).
#
# See NPM_PUBLISHING.md for the full step-by-step.

name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

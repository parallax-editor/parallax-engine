# Automated releases — Conventional Commits → SemVer, no manual version bump.
#
# On every push to main, we read the commits since the last vX.Y.Z tag and let
# the conventional-commit history decide the next version:
#   fix:/perf: → patch    feat: → minor    feat!/BREAKING CHANGE → major
# chore/docs/refactor/test/ci alone do NOT cut a release (default_bump: false).
#
# When a release is warranted the action creates + pushes the tag directly
# (tags are NOT subject to main's branch protection — same path the old
# auto-tag.yml used), publishes a GitHub Release with the generated notes, and
# the `publish` job below chains into publish.yml (OIDC Trusted Publishing) to
# ship to npm. No human bumps a version by hand.
#
# Why the repo's package.json version stays put: this org forbids Actions from
# creating PRs and main is protection-locked, so a bot can neither open a
# "release PR" (release-please) nor push a bump commit to main. The TAG is the
# source of truth for the released version; publish.yml sets package.json to the
# tag's version at publish time (`npm version --no-git-tag-version`) so npm gets
# the right number without any commit back to the repo.
#
# Why chain publish.yml via `workflow_call` instead of its `on: push: tags`
# trigger: GITHUB_TOKEN has anti-loop protection — a tag pushed with
# GITHUB_TOKEN does NOT fire `on: push: tags` workflows. workflow_call sidesteps
# that and keeps the OIDC subject pointing at publish.yml.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the action can diff against the last tag.
          fetch-depth: 0
      - name: Compute + push next tag from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Only release when the commits actually warrant it — a push of only
          # chore/docs/ci produces no tag (and no publish).
          default_bump: false
          release_branches: main
      - name: Publish GitHub Release with generated notes
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

  # Runs ONLY when a new tag was cut. Enters the npm-publish environment + gets
  # OIDC id-token, exactly like the old auto-tag → publish chain.
  publish:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
    secrets: inherit
